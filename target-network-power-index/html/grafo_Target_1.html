        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 900px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "green", "font": {"size": 30}, "id": "n0", "label": "Target", "shape": "dot", "size": 20}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n1", "label": "Company 1", "shape": "dot", "size": 20.0}, {"color": "red", "font": {"size": 30}, "id": "n2", "label": "Ultimate Owner", "shape": "dot", "size": 52.430762132640595}, {"color": "#fcb296", "font": {"size": 30}, "id": "n3", "label": "Company 3", "shape": "dot", "size": 36.87430032478744}, {"color": "#fcb296", "font": {"size": 30}, "id": "n4", "label": "Company 4", "shape": "dot", "size": 36.86020316495052}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n5", "label": "Company 5", "shape": "dot", "size": 20.0}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n6", "label": "Company 6", "shape": "dot", "size": 20.0}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n7", "label": "Company 7", "shape": "dot", "size": 20.0}, {"color": "#fcbea5", "font": {"size": 30}, "id": "n8", "label": "Company 8", "shape": "dot", "size": 34.343155276069325}, {"color": "#fdc9b3", "font": {"size": 30}, "id": "n9", "label": "Company 9", "shape": "dot", "size": 32.191681984659}, {"color": "#fc8666", "font": {"size": 30}, "id": "n10", "label": "Company 10", "shape": "dot", "size": 44.694102377168306}, {"color": "#fc9b7c", "font": {"size": 30}, "id": "n11", "label": "Company 11", "shape": "dot", "size": 40.98998702059289}, {"color": "#fcab8f", "font": {"size": 30}, "id": "n12", "label": "Company 12", "shape": "dot", "size": 37.8414889675041}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n13", "label": "Company 13", "shape": "dot", "size": 20.0}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n14", "label": "Company 14", "shape": "dot", "size": 20.0}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n15", "label": "Company 15", "shape": "dot", "size": 20.0}, {"color": "#fff5f0", "font": {"size": 30}, "id": "n16", "label": "Company 16", "shape": "dot", "size": 20.0}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "gray", "from": "n1", "to": "n0", "width": 1.5}, {"arrows": "to", "color": "red", "from": "n2", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n2", "to": "n12", "width": 3}, {"arrows": "to", "color": "red", "from": "n3", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n4", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n5", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n6", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n7", "to": "n0", "width": 3}, {"arrows": "to", "color": "red", "from": "n8", "to": "n3", "width": 3}, {"arrows": "to", "color": "red", "from": "n8", "to": "n16", "width": 3}, {"arrows": "to", "color": "red", "from": "n9", "to": "n8", "width": 3}, {"arrows": "to", "color": "red", "from": "n10", "to": "n9", "width": 3}, {"arrows": "to", "color": "red", "from": "n10", "to": "n4", "width": 3}, {"arrows": "to", "color": "red", "from": "n11", "to": "n10", "width": 3}, {"arrows": "to", "color": "red", "from": "n11", "to": "n14", "width": 3}, {"arrows": "to", "color": "red", "from": "n12", "to": "n11", "width": 3}, {"arrows": "to", "color": "red", "from": "n13", "to": "n5", "width": 3}, {"arrows": "to", "color": "red", "from": "n14", "to": "n13", "width": 3}, {"arrows": "to", "color": "red", "from": "n14", "to": "n7", "width": 3}, {"arrows": "to", "color": "red", "from": "n15", "to": "n6", "width": 3}, {"arrows": "to", "color": "red", "from": "n16", "to": "n15", "width": 3}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    
    <script type="text/javascript">
    network.on("hoverNode", function(params) {
        var nodeId = params.node;
        var options = network.body.nodes[nodeId].options;
        options.font.size = 60;
        network.redraw();
    });
    network.on("blurNode", function(params) {
        var nodeId = params.node;
        var options = network.body.nodes[nodeId].options;
        options.font.size = 30;
        network.redraw();
    });
    </script>
    
</body>
